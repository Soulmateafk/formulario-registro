<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Operaciones</title>
  <style>
    :root {
      --primary-color: #3b82f6; /* Azul confirmado del logo Rutograma/Makand */
      --primary-hover: #306ac9; /* Mismo azul, más oscuro para hover */
      --accent-color: #fb923c; /* Naranja confirmado de la barra superior/puntos del login */
      --bg-color: #121b2e;      /* Fondo oscuro exacto de la app Rutograma */
      --panel-color: #172846;   /* Tono del recuadro del ícono en el login */
      --input-bg: #0c1424;      /* Fondo de los inputs, tomado del login */
      --border-color: #2c3a56;
      --text-color: #e2e8f0;
      --muted-color: #94a3b8;
      --disabled-bg: #1e293b;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    form {
      position: relative;
      background: var(--panel-color);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.06);
      width: 100%;
      max-width: 700px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    form::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      border-radius: 12px 12px 0 0;
      background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
    }

    .logo-dots {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
    }

    .logo-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary-color);
    }

    .logo-dots span:nth-child(2) {
      background: var(--accent-color);
    }

    .logo-header {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--input-bg);
      border: 1px solid rgba(59, 130, 246, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 28px;
      height: 28px;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo-text .maka { color: var(--text-color); }
    .logo-text .nd { color: var(--primary-color); }

    .logo-sub {
      font-size: 12px;
      color: var(--muted-color);
      margin-bottom: 6px;
    }

    h2 {
      grid-column: 1 / -1;
      text-align: center;
      margin-top: 0;
      margin-bottom: 10px;
      color: var(--text-color);
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    /* Campos con buscador flotante (cliente, tienda, sucursal, dependencia, placa) */
    .searchable-group {
      position: relative;
    }

    .custom-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 230px;
      overflow-y: auto;
      background: var(--panel-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      margin-top: 4px;
      display: none;
    }

    .dropdown-header {
      background: rgba(59, 130, 246, 0.12);
      padding: 6px 12px;
      font-weight: 700;
      font-size: 11px;
      color: var(--primary-color);
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(59, 130, 246, 0.25);
    }

    .dropdown-header.header-viajero {
      color: var(--accent-color);
      background: rgba(251, 146, 60, 0.12);
      border-bottom-color: rgba(251, 146, 60, 0.25);
    }

    .dropdown-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-color);
      transition: background-color 0.2s;
    }

    .dropdown-item:hover {
      background-color: var(--primary-color);
      color: white;
    }

    .no-results {
      padding: 12px;
      color: var(--muted-color);
      font-style: italic;
      text-align: center;
      font-size: 14px;
    }

    label {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-color);
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-color);
      transition: border-color 0.3s, box-shadow 0.3s;
      background-color: var(--input-bg);
    }

    ::placeholder {
      color: var(--muted-color);
      opacity: 1;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    input:disabled {
      background-color: var(--disabled-bg);
      color: var(--muted-color);
      cursor: not-allowed;
    }

    input[readonly] {
      background-color: rgba(59, 130, 246, 0.15);
      font-weight: 600;
      color: #93c0ff;
    }

    input[readonly].tipo-viajero {
      background-color: rgba(251, 146, 60, 0.15);
      color: var(--accent-color);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    select option {
      background: var(--panel-color);
      color: var(--text-color);
    }

    button {
      grid-column: 1 / -1;
      padding: 14px;
      background: linear-gradient(90deg, var(--primary-hover), #b4692b);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: filter 0.3s;
      margin-top: 10px;
    }

    button:hover {
      filter: brightness(1.12);
    }

    button:disabled {
      background: #334155;
      color: var(--muted-color);
      cursor: not-allowed;
    }

    small {
      font-size: 12px;
      color: var(--muted-color);
      margin-top: 4px;
    }

    @media (max-width: 600px) {
      form {
        grid-template-columns: 1fr;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <form id="registroForm">
    <div class="logo-header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2V7Z" stroke="#3b82f6" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M15 10h3.2a1 1 0 0 1 .8.4l2 2.6a1 1 0 0 1 .2.6V16h-6v-6Z" stroke="#3b82f6" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="8" cy="17.5" r="1.6" stroke="#3b82f6" stroke-width="1.8"/>
          <circle cx="18" cy="17.5" r="1.6" stroke="#3b82f6" stroke-width="1.8"/>
        </svg>
      </div>
      <div class="logo-text"><span class="maka">MAKA</span><span class="nd">ND</span></div>
      <div class="logo-sub">Logística de transporte</div>
      <div class="logo-dots"><span></span><span></span><span></span></div>
    </div>

    <h2>Registro de Operaciones</h2>

    <div class="form-group searchable-group" id="grupoCliente">
      <label>Cliente:</label>
      <input type="text" id="searchCliente" placeholder="Busque un cliente..." autocomplete="off" required>
      <div id="dropdownCliente" class="custom-dropdown"></div>
      <input type="hidden" name="cliente" id="valueCliente" required>
    </div>

    <div class="form-group searchable-group" id="grupoTienda" style="display:none;">
      <label>Tienda:</label>
      <input type="text" id="searchTienda" placeholder="Seleccione primero un cliente..." autocomplete="off" required disabled>
      <div id="dropdownTienda" class="custom-dropdown"></div>
      <input type="hidden" name="tienda" id="valueTienda" required>
    </div>

    <div class="form-group searchable-group" id="grupoSucursal" style="display:none;">
      <label>Sucursal:</label>
      <input type="text" id="searchSucursal" placeholder="Seleccione primero una tienda..." autocomplete="off" required disabled>
      <div id="dropdownSucursal" class="custom-dropdown"></div>
      <input type="hidden" name="sucursal" id="valueSucursal" required>
    </div>

    <div class="form-group searchable-group" id="grupoDependencia" style="display:none;">
      <label>Dependencia:</label>
      <input type="text" id="searchDependencia" placeholder="Seleccione primero una sucursal..." autocomplete="off" required disabled>
      <div id="dropdownDependencia" class="custom-dropdown"></div>
      <input type="hidden" name="dependencia" id="valueDependencia" required>
    </div>

    <div class="form-group full-width">
      <label>Tipo de viaje:</label>
      <input type="text" name="tipo" id="valueTipo" placeholder="Se completa automáticamente" readonly required>
    </div>

    <div class="form-group">
      <label>Hora de radicación:</label>
      <input type="time" name="hora_radicacion" required>
    </div>

    <div class="form-group">
      <label>Hora de ingreso a muelle:</label>
      <input type="time" name="hora_ingreso" required>
    </div>

    <div class="form-group">
      <label>Hora de salida de muelle:</label>
      <input type="time" name="hora_salida" required>
    </div>

    <div class="form-group">
      <label>Hora de facturación:</label>
      <input type="time" name="hora_facturacion" required>
    </div>

    <div class="form-group">
      <label>Hora de recolección de cajas:</label>
      <input type="time" name="hora_recoleccion_cajas" required>
    </div>

    <div class="form-group searchable-group full-width" id="grupoPlaca" style="display:none;">
      <label>Placa del vehículo:</label>
      <input type="text" id="searchPlaca" placeholder="Seleccione primero cliente/tienda/sucursal/dependencia..." autocomplete="off" required disabled>
      <div id="dropdownPlaca" class="custom-dropdown"></div>
      <input type="hidden" name="placa" id="valuePlaca" required>
      <small>Escriba para buscar; solo puede elegir una placa de la lista.</small>
    </div>

    <div class="form-group searchable-group" id="grupoProductoUnificado">
      <label>Producto unificado:</label>
      <input type="text" id="searchProductoUnificado" placeholder="Busque un producto..." autocomplete="off" required>
      <div id="dropdownProductoUnificado" class="custom-dropdown"></div>
      <input type="hidden" name="producto_unificado" id="valueProductoUnificado" required>
    </div>

    <div class="form-group searchable-group" id="grupoArticulo" style="display:none;">
      <label>Artículo y/o servicio:</label>
      <input type="text" id="searchArticulo" placeholder="Seleccione primero un producto unificado..." autocomplete="off" required disabled>
      <div id="dropdownArticulo" class="custom-dropdown"></div>
      <input type="hidden" name="articulo_servicio" id="valueArticulo" required>
    </div>

    <div class="form-group full-width">
      <label>Código de barras:</label>
      <input type="text" name="codigo_barras" id="valueCodigoBarras" placeholder="Se completa automáticamente" readonly>
    </div>

    <div class="form-group">
      <label>Cantidad total de devolución:</label>
      <input type="number" name="cantidad_devolucion" min="1" required>
      <small>Solo valores numéricos</small>
    </div>

    <div class="form-group">
      <label>Unidad de medida base:</label>
      <select name="unidad_medida_base" required>
        <option value="" disabled selected>Seleccione una unidad...</option>
        <option value="unidad">Unidad</option>
        <option value="canastilla">Canastilla</option>
        <option value="caja">Caja</option>
        <option value="otro">otro</option>
      </select>
    </div>

    <div class="form-group full-width">
      <label>Motivo devolución:</label>
      <textarea name="motivo_devolucion" required></textarea>
    </div>

    <button type="submit">Guardar Registro</button>
  </form>

    // ============================================================
    // Componente genérico de "buscador con lista flotante"
    // ============================================================
    function setupSearchable(cfg) {
      const input = document.getElementById(cfg.inputId);
      const hidden = document.getElementById(cfg.hiddenId);
      const dropdown = document.getElementById(cfg.dropdownId);
      const group = document.getElementById(cfg.groupId);

      function render(filterText) {
        const f = (filterText || '').toLowerCase();
        dropdown.innerHTML = '';

        if (cfg.getGroups) {
          const groups = cfg.getGroups();
          let totalShown = 0;
          groups.forEach(grp => {
            const filtered = (grp.items || []).filter(o => o.toLowerCase().includes(f));
            if (filtered.length === 0) return;
            totalShown += filtered.length;
            const header = document.createElement('div');
            header.className = 'dropdown-header' + (grp.colorClass ? ' ' + grp.colorClass : '');
            header.innerText = grp.header;
            dropdown.appendChild(header);
            filtered.sort((a, b) => a.localeCompare(b)).forEach(opt => {
              const row = document.createElement('div');
              row.className = 'dropdown-item';
              row.innerText = opt;
              row.addEventListener('click', () => {
                input.value = opt;
                hidden.value = opt;
                dropdown.style.display = 'none';
                input.setCustomValidity('');
                if (cfg.onSelect) cfg.onSelect(opt);
              });
              dropdown.appendChild(row);
            });
          });
          if (totalShown === 0) {
            dropdown.innerHTML = '<div class="no-results">No se encontraron resultados</div>';
          }
          return;
        }

        const options = cfg.getOptions() || [];
        if (options.length === 0) {
          dropdown.innerHTML = '<div class="no-results">No hay opciones disponibles</div>';
          return;
        }
        const filtered = options.filter(o => o.toLowerCase().includes(f));
        if (filtered.length === 0) {
          dropdown.innerHTML = '<div class="no-results">No se encontraron resultados</div>';
          return;
        }
        filtered.sort((a, b) => a.localeCompare(b)).forEach(opt => {
          const row = document.createElement('div');
          row.className = 'dropdown-item';
          row.innerText = opt;
          row.addEventListener('click', () => {
            input.value = opt;
            hidden.value = opt;
            dropdown.style.display = 'none';
            input.setCustomValidity('');
            if (cfg.onSelect) cfg.onSelect(opt);
          });
          dropdown.appendChild(row);
        });
      }

      input.addEventListener('focus', () => {
        if (input.disabled) return;
        render(input.value);
        dropdown.style.display = 'block';
      });

      input.addEventListener('input', () => {
        hidden.value = '';
        input.setCustomValidity('Debes seleccionar una opción válida de la lista.');
        render(input.value);
        dropdown.style.display = 'block';
        if (cfg.onClear) cfg.onClear();
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#' + cfg.groupId)) {
          dropdown.style.display = 'none';
          if (!hidden.value) input.value = '';
        }
      });

      return {
        setEnabled(enabled, placeholderText) {
          input.disabled = !enabled;
          group.style.display = enabled ? '' : 'none';
          if (placeholderText) input.placeholder = placeholderText;
          if (!enabled) {
            input.value = '';
            hidden.value = '';
          }
        },
        clearOnly() {
          input.value = '';
          hidden.value = '';
        },
        setValue(val) {
          input.value = val;
          hidden.value = val;
        }
      };
    }

    const tipoInput = document.getElementById('valueTipo');

    function setTipo(valor) {
      tipoInput.value = valor;
      tipoInput.classList.toggle('tipo-viajero', valor === 'VIAJERO');
    }

    const placaCtrl = setupSearchable({
      inputId: 'searchPlaca', hiddenId: 'valuePlaca', dropdownId: 'dropdownPlaca', groupId: 'grupoPlaca',
      getGroups: () => [
        { header: 'URBANO', items: placasPorTipo.URBANO },
        { header: 'VIAJERO', items: placasPorTipo.VIAJERO, colorClass: 'header-viajero' }
      ]
    });

    const codigoBarrasInput = document.getElementById('valueCodigoBarras');

    const articuloCtrl = setupSearchable({
      inputId: 'searchArticulo', hiddenId: 'valueArticulo', dropdownId: 'dropdownArticulo', groupId: 'grupoArticulo',
      getOptions: () => {
        if (!state.productoUnificado) return [];
        return dataProductos[state.productoUnificado].map(it => it.articulo + ' | ' + it.codigo);
      },
      onSelect: (opt) => {
        // La opción viene como "ARTICULO | CODIGO" para que se puedan distinguir
        // artículos con el mismo nombre pero código distinto. Aquí separamos
        // ambas partes: el campo visible se queda solo con el nombre del artículo,
        // y el código de barras se autocompleta en su propio campo (solo lectura).
        const idx = opt.lastIndexOf(' | ');
        const articulo = idx >= 0 ? opt.slice(0, idx) : opt;
        const codigo = idx >= 0 ? opt.slice(idx + 3) : '';
        document.getElementById('searchArticulo').value = articulo;
        document.getElementById('valueArticulo').value = articulo;
        codigoBarrasInput.value = codigo;
      },
      onClear: () => {
        codigoBarrasInput.value = '';
      }
    });

    const productoUnificadoCtrl = setupSearchable({
      inputId: 'searchProductoUnificado', hiddenId: 'valueProductoUnificado', dropdownId: 'dropdownProductoUnificado', groupId: 'grupoProductoUnificado',
      getOptions: () => Object.keys(dataProductos),
      onSelect: (val) => {
        state.productoUnificado = val;
        articuloCtrl.clearOnly();
        articuloCtrl.setEnabled(true, 'Seleccione un artículo o servicio...');
        codigoBarrasInput.value = '';
      },
      onClear: () => {
        state.productoUnificado = null;
        articuloCtrl.setEnabled(false, 'Seleccione primero un producto unificado...');
        codigoBarrasInput.value = '';
      }
    });

    const dependenciaCtrl = setupSearchable({
      inputId: 'searchDependencia', hiddenId: 'valueDependencia', dropdownId: 'dropdownDependencia', groupId: 'grupoDependencia',
      getOptions: () => {
        if (!(state.cliente && state.tienda && state.sucursal)) return [];
        return dataClientes[state.cliente][state.tienda][state.sucursal].map(d => d.dep);
      },
      onSelect: (val) => {
        const deps = dataClientes[state.cliente][state.tienda][state.sucursal];
        const found = deps.find(d => d.dep === val);
        setTipo(found ? found.tipo : '');
        placaCtrl.clearOnly();
        placaCtrl.setEnabled(true, 'Busque una placa...');
      },
      onClear: () => {
        setTipo('');
        placaCtrl.setEnabled(false, 'Seleccione primero cliente/tienda/sucursal/dependencia...');
      }
    });

    const sucursalCtrl = setupSearchable({
      inputId: 'searchSucursal', hiddenId: 'valueSucursal', dropdownId: 'dropdownSucursal', groupId: 'grupoSucursal',
      getOptions: () => {
        if (!(state.cliente && state.tienda)) return [];
        return Object.keys(dataClientes[state.cliente][state.tienda]);
      },
      onSelect: (val) => {
        state.sucursal = val;
        dependenciaCtrl.clearOnly();
        setTipo('');
        placaCtrl.setEnabled(false, 'Seleccione primero cliente/tienda/sucursal/dependencia...');

        const deps = dataClientes[state.cliente][state.tienda][val];
        if (deps.length === 1) {
          // Única dependencia posible: se autocompleta para agilizar el registro
          dependenciaCtrl.setValue(deps[0].dep);
          dependenciaCtrl.setEnabled(true);
          setTipo(deps[0].tipo);
          placaCtrl.clearOnly();
          placaCtrl.setEnabled(true, 'Busque una placa...');
        } else {
          dependenciaCtrl.setEnabled(true, 'Seleccione una dependencia...');
        }
      },
      onClear: () => {
        state.sucursal = null;
        dependenciaCtrl.setEnabled(false, 'Seleccione primero una sucursal...');
        setTipo('');
        placaCtrl.setEnabled(false, 'Seleccione primero cliente/tienda/sucursal/dependencia...');
      }
    });

    const tiendaCtrl = setupSearchable({
      inputId: 'searchTienda', hiddenId: 'valueTienda', dropdownId: 'dropdownTienda', groupId: 'grupoTienda',
      getOptions: () => state.cliente ? Object.keys(dataClientes[state.cliente]) : [],
      onSelect: (val) => {
        state.tienda = val;
        state.sucursal = null;
        sucursalCtrl.clearOnly();
        sucursalCtrl.setEnabled(true, 'Seleccione una sucursal...');
        dependenciaCtrl.setEnabled(false, 'Seleccione primero una sucursal...');
        setTipo('');
        placaCtrl.setEnabled(false, 'Seleccione primero cliente/tienda/sucursal/dependencia...');
      },
      onClear: () => {
        state.tienda = null;
        state.sucursal = null;
        sucursalCtrl.setEnabled(false, 'Seleccione primero una tienda...');
        dependenciaCtrl.setEnabled(false, 'Seleccione primero una sucursal...');
        setTipo('');
        placaCtrl.setEnabled(false, 'Seleccione primero cliente/tienda/sucursal/dependencia...');
      }
    });

    const clienteCtrl = setupSearchable({
      inputId: 'searchCliente', hiddenId: 'valueCliente', dropdownId: 'dropdownCliente', groupId: 'grupoCliente',
      getOptions: () => Object.keys(dataClientes),
      onSelect: (val) => {
        state.cliente = val;
        state.tienda = null;
        state.sucursal = null;
        tiendaCtrl.clearOnly();
        tiendaCtrl.setEnabled(true, 'Seleccione una tienda...');
        sucursalCtrl.setEnabled(false, 'Seleccione primero una tienda...');
        dependenciaCtrl.setEnabled(false, 'Seleccione primero una sucursal...');
        setTipo('');
        placaCtrl.setEnabled(false, 'Seleccione primero cliente/tienda/sucursal/dependencia...');
      },
      onClear: () => {
        state.cliente = null;
        state.tienda = null;
        state.sucursal = null;
        tiendaCtrl.setEnabled(false, 'Seleccione primero un cliente...');
        sucursalCtrl.setEnabled(false, 'Seleccione primero una tienda...');
        dependenciaCtrl.setEnabled(false, 'Seleccione primero una sucursal...');
        setTipo('');
        placaCtrl.setEnabled(false, 'Seleccione primero cliente/tienda/sucursal/dependencia...');
      }
    });

    // ============================================================
    // Envío del formulario
    // ============================================================
    document.getElementById("registroForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const camposObligatorios = [
        { hidden: 'valueCliente', input: 'searchCliente', msg: 'Debes seleccionar un cliente válido de la lista.' },
        { hidden: 'valueTienda', input: 'searchTienda', msg: 'Debes seleccionar una tienda válida de la lista.' },
        { hidden: 'valueSucursal', input: 'searchSucursal', msg: 'Debes seleccionar una sucursal válida de la lista.' },
        { hidden: 'valueDependencia', input: 'searchDependencia', msg: 'Debes seleccionar una dependencia válida de la lista.' },
        { hidden: 'valuePlaca', input: 'searchPlaca', msg: 'Debes seleccionar una placa válida de la lista.' }
      ];

      for (const campo of camposObligatorios) {
        const hiddenEl = document.getElementById(campo.hidden);
        if (!hiddenEl.value) {
          alert(campo.msg);
          document.getElementById(campo.input).focus();
          return;
        }
      }

      if (!this.checkValidity()) {
        alert("Por favor completa todos los campos correctamente.");
        return;
      }

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      const ahora = new Date();
      data.fecha_envio = ahora.toLocaleDateString();
      data.hora_envio = ahora.toLocaleTimeString();

      const btnSubmit = this.querySelector('button[type="submit"]');
      btnSubmit.disabled = true;
      btnSubmit.innerText = "Guardando...";

      try {
        await fetch("https://script.google.com/macros/s/AKfycbzTDLu2EQ8rhapSPf2ZgV3Gs8IxsjMj7EXTmrCgU6mQOoAm8nra6oHBZZTFZis3rCwc/exec", {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify(data)
        });

        alert("Registro guardado en Google Sheets con éxito.");
        this.reset();

        // Restaurar cascada al estado inicial
        state.cliente = null; state.tienda = null; state.sucursal = null;
        tiendaCtrl.setEnabled(false, 'Seleccione primero un cliente...');
        sucursalCtrl.setEnabled(false, 'Seleccione primero una tienda...');
        dependenciaCtrl.setEnabled(false, 'Seleccione primero una sucursal...');
        setTipo('');
        placaCtrl.setEnabled(false, 'Seleccione primero cliente/tienda/sucursal/dependencia...');
      } catch (error) {
        alert("Ocurrió un error al guardar. Intenta nuevamente.");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Guardar Registro";
      }
    });
  </script>
</body>
</html>
